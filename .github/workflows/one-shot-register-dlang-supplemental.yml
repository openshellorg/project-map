name: one-shot-register-dlang-supplemental

# Temporary: register dub-publish + dubx using this repo's DUB secrets.
on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: dlang-supplemental/dub-publish
            package: dub-publish
          - repo: dlang-supplemental/dubx
            package: dubx
    steps:
      - name: Checkout package
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: package

      - name: Checkout dub-publish CLI
        uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dub-publish
          path: dub-publish

      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Register ${{ matrix.package }}
        env:
          DUB_REGISTRY_USER: ${{ secrets.DUB_REGISTRY_USER }}
          DUB_REGISTRY_PASSWORD: ${{ secrets.DUB_REGISTRY_PASSWORD }}
        working-directory: dub-publish
        run: |
          set -euo pipefail
          dub build --build=release
          ./dub-publish register \
            --root ../package \
            --url "https://github.com/${{ matrix.repo }}" \
            --package "${{ matrix.package }}" \
            --ignore-fork
          ./dub-publish status -n "${{ matrix.package }}" || true
