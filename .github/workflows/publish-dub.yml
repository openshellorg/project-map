name: dub-publish

# Registers/refreshes project-map on code.dlang.org via dlang-supplemental/dub-publish.
# Root recipe name is project-map (library sources under lib/source).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    uses: dlang-supplemental/dub-publish/.github/workflows/register-package.yml@main
    with:
      package: project-map
      url: https://github.com/${{ github.repository }}
      root: .
      ignore_fork: true
    secrets:
      DUB_REGISTRY_USER: ${{ secrets.DUB_REGISTRY_USER }}
      DUB_REGISTRY_PASSWORD: ${{ secrets.DUB_REGISTRY_PASSWORD }}
