name: dub-publish

# Registers/refreshes the package on code.dlang.org via dlang-supplemental/dub-publish.
# Registered package name is the root recipe: project-map-workspace (lib/ is a path dep).
# After registration, SemVer tags (v*) are picked up by the registry (or refreshed here).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    uses: dlang-supplemental/dub-publish/.github/workflows/register-package.yml@main
    with:
      package: project-map-workspace
      url: https://github.com/${{ github.repository }}
      root: .
      ignore_fork: true
    secrets:
      DUB_REGISTRY_USER: ${{ secrets.DUB_REGISTRY_USER }}
      DUB_REGISTRY_PASSWORD: ${{ secrets.DUB_REGISTRY_PASSWORD }}
