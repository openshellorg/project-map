name: project-map CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project-map
        uses: actions/checkout@v4
        with:
          path: project-map

      - name: Checkout json5-dlang (path dependency)
        uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/json5-dlang
          path: dlang-supplemental/json5-dlang

      - name: Set up D (LDC)
        uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Build library (project-map)
        working-directory: project-map/lib
        run: dub build --build=release

      - name: Build CLI (lsgrouped)
        working-directory: project-map/apps/lsgrouped
        run: dub build --build=release
